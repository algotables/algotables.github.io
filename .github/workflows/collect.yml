name: collect

on:
  push:
    branches: [reboot/phase-1]
    paths: ['collect/**', '.github/workflows/collect.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe data sources
        run: node collect/spike.mjs
